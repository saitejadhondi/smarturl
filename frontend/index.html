<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartURL Dashboard</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="container"><h1>SmartURL</h1><p>Short URLs, analytics and QR codes</p>
<section class="card"><h2>Create Short URL</h2><form id="urlForm">
<input id="url" type="url" placeholder="https://example.com" required>
<input id="alias" placeholder="custom alias (optional)">
<input id="expires" type="datetime-local">
<button>Create</button></form><pre id="result"></pre></section>
<section class="card"><h2>Analytics</h2><div class="row"><input id="code" placeholder="Short code"><button id="analyticsButton">Load</button></div><pre id="analytics"></pre></section>
<section class="card"><h2>QR Code</h2><div class="row"><input id="qrCode" placeholder="Short code"><button id="qrButton">Generate</button></div><img id="qr" class="qr" alt="QR code"></section>
</main><script src="/assets/app.js" defer></script></body></html>
